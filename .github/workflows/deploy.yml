name: Deploy
# Runs only after verification passes on main; infrastructure itself is applied manually with Terraform.
on:
  workflow_run:
    workflows: [Backend verification]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: ${{ vars.IMAGE_REPOSITORY }}/app:${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
      - run: docker build -t "$IMAGE" . && docker push "$IMAGE"
      - name: Deploy Cloud Run revision
        run: >
          gcloud run deploy ${{ vars.APP_NAME }}
          --image "$IMAGE"
          --region ${{ vars.GCP_REGION }}
          --project ${{ vars.GCP_PROJECT_ID }}
          --service-account ${{ vars.RUNTIME_SA }}
          --quiet
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Deploy Firestore rules, indexes and Hosting
        run: npx --yes firebase-tools@15.33.0 deploy --only firestore,hosting --project ${{ vars.GCP_PROJECT_ID }} --non-interactive
